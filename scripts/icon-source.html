<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 1024px;
    height: 1024px;
    background: transparent;
  }
  .icon {
    width: 1024px;
    height: 1024px;
    border-radius: 224px;
    background: linear-gradient(160deg, #5b8bff 0%, #3b6ef6 60%, #2f5ad9 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  svg { display: block; }
</style>
</head>
<body>
  <div class="icon">
    <svg width="620" height="620" viewBox="0 0 620 620" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Column 1 -->
      <rect x="40" y="70" width="160" height="480" rx="28" fill="rgba(255,255,255,0.16)"/>
      <rect x="66" y="110" width="108" height="66" rx="14" fill="#ffffff"/>
      <rect x="66" y="192" width="108" height="66" rx="14" fill="#ffffff" opacity="0.85"/>

      <!-- Column 2 -->
      <rect x="230" y="70" width="160" height="480" rx="28" fill="rgba(255,255,255,0.16)"/>
      <rect x="256" y="110" width="108" height="66" rx="14" fill="#ffffff"/>

      <!-- Column 3 -->
      <rect x="420" y="70" width="160" height="480" rx="28" fill="rgba(255,255,255,0.16)"/>
      <rect x="446" y="110" width="108" height="66" rx="14" fill="#ffffff" opacity="0.9"/>
      <path d="M466 145 L484 163 L522 122" stroke="#3b6ef6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
  </div>
</body>
</html>
